<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termin buchen</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="zurueck-link" href="index.html">← Zurück zur Startseite</a>
    <main>
        <section class="buchung">
            <h1> Termin buchen</h1>

            <p> Wähle deinen gewünschten Termin</p>
            <form id="buchungsformular">

                <label for="leistung">Leistung</label>

                <select id="leistung" name="leistung" required>
                    <option value="">Leistung auswählen</option>
                    <option value="haarschnitt">Haarschnitt – CHF 15</option>
                </select>

                <label for="datum">Datum</label>

                <input type="date" id="datum" name="datum" required>


                <label for="uhrzeit">Uhrzeit</label>

                <select id="uhrzeit" name="uhrzeit" required>
                    <option value="">Uhrzeit auswählen</option>
                    <option value="18:00">18:00</option>
                    <option value="19:00">19:00</option>
                    <option value="20:00">20:00</option>
                </select>

                <label for="name">Name</label>

                <input type="text" id="name" name="name" placeholder="Dein Name" required>

                <label for="email">E-Mail</label>
                <input type="email" id="email" name="email" placeholder="name@email.ch" required>

                <label for="telefon">Telefon</label>
                <input type="tel"
                id="telefon"
                name="telefon"
                placeholder="079 123 45 67"
                >

                <button type="submit">Termin anfragen</button>
            </form>

            <p class="buchungs-hinweis">
                Dein Termin ist erst nach meiner Bestätigung gültig.

            </p>
        </section>
    </main>
</body>

</html>
